spring.application.name=GymLink
server.port=8080

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gymlinkdb?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Subida de fotos en el Club Social
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
gymlink.uploads.dir=uploads