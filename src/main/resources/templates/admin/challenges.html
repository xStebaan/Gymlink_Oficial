<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin_layout :: layout('Misiones y Retos | GymLink Admin', 'challenges', ~{::main})}">
<body>
<main>
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <span class="text-neon small fw-bold text-uppercase">Motor de Gamificación</span>
            <h1 class="fw-bolder text-white mb-0">Gestor de Misiones y Retos</h1>
        </div>
        <button type="button" class="btn btn-neon rounded-pill px-4"
                data-bs-toggle="modal" data-bs-target="#challengeFormModal">
            <i class="bi bi-lightning-fill me-1"></i>Lanzar Nuevo Reto
        </button>
    </div>

    <!-- Listado de Retos Activos -->
    <div class="row g-4">
        <div class="col-md-6 col-xl-4" th:each="ch : ${challenges}">
            <div class="bento-card p-4 h-100 d-flex flex-column justify-content-between">
                <div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="badge bg-dark border border-secondary border-opacity-25 text-info rounded-pill px-3"
                              th:text="${ch.frequency}">SEMANAL</span>
                        <span class="badge rounded-pill"
                              th:classappend="${ch.active} ? 'bg-neon-soft' : 'bg-secondary bg-opacity-25 text-secondary'"
                              th:text="${ch.active} ? 'Activo' : 'Finalizado'">Activo</span>
                    </div>
                    <h5 class="fw-bold text-white mb-2" th:text="${ch.title}">Semana Espartana</h5>
                    <p class="text-secondary small mb-3" th:text="${ch.description}">
                        Asiste al menos 5 veces durante esta semana para desbloquear bono extra.
                    </p>
                </div>

                <div class="pt-3 border-top border-secondary border-opacity-25">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="small text-secondary">Meta: <strong class="text-white font-mono-tabular" th:text="${ch.targetCount} + ' check-ins'">5 check-ins</strong></span>
                        <span class="font-mono-tabular fw-bold text-neon">+<span th:text="${ch.pointsReward}">300</span> PTS · +<span th:text="${ch.xpReward}">200</span> XP</span>
                    </div>
                    <form th:action="@{/admin/challenges/{id}/toggle(id=${ch.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-ghost-dark w-100 rounded-pill"
                                th:text="${ch.active} ? 'Desactivar Reto' : 'Reactivar Reto'">Desactivar Reto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Lanzar Nuevo Reto -->
    <div class="modal fade" id="challengeFormModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border border-secondary border-opacity-25 rounded-4">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold text-white"><i class="bi bi-lightning-charge-fill text-neon me-2"></i>Nuevo Reto / Misión</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/challenges/save}" method="post">
                    <div class="modal-body p-4 d-flex flex-column gap-3">
                        <div>
                            <label class="form-label small text-secondary">Título del Reto</label>
                            <input type="text" name="title" required
                                   class="form-control bg-black border-secondary border-opacity-25 text-white"
                                   placeholder="Ej. Maratón de Noviembre">
                        </div>

                        <div>
                            <label class="form-label small text-secondary">Descripción</label>
                            <textarea name="description" rows="2" required
                                      class="form-control bg-black border-secondary border-opacity-25 text-white"
                                      placeholder="Explica cómo completar la misión"></textarea>
                        </div>

                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label small text-secondary">Frecuencia</label>
                                <select name="frequency" class="form-select bg-black border-secondary border-opacity-25 text-white">
                                    <option value="SEMANAL">Semanal</option>
                                    <option value="MENSUAL">Mensual</option>
                                    <option value="RELAMPAGO">Relámpago</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-secondary">Meta (Asistencias)</label>
                                <input type="number" name="targetCount" min="1" value="4" required
                                       class="form-control bg-black border-secondary border-opacity-25 text-white font-mono-tabular">
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label small text-secondary">Recompensa Puntos</label>
                                <input type="number" name="pointsReward" min="50" value="250" required
                                       class="form-control bg-black border-secondary border-opacity-25 text-white font-mono-tabular">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-secondary">Recompensa XP</label>
                                <input type="number" name="xpReward" min="50" value="150" required
                                       class="form-control bg-black border-secondary border-opacity-25 text-white font-mono-tabular">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary border-opacity-25">
                        <button type="button" class="btn btn-ghost-dark rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-neon rounded-pill px-4">Publicar Reto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
