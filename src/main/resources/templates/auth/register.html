<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Atleta | GymLink</title>
    <script>
        (function () {
            const t = localStorage.getItem('gymlink-theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/gymlink.css}" rel="stylesheet">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3 p-md-4 position-relative">

<button type="button" data-theme-toggle
        class="btn btn-ghost-dark btn-sm rounded-pill px-3 position-absolute top-0 end-0 m-4 d-flex align-items-center gap-1">
    <i class="bi bi-sun-fill text-warning"></i>
    <span data-theme-label class="small fw-semibold">Claro</span>
</button>

<div class="w-100" style="max-width: 500px;">
    <div class="text-center mb-4">
        <a th:href="@{/login}" class="d-inline-flex align-items-center gap-2 text-decoration-none">
            <div class="rounded-3 d-flex align-items-center justify-content-center bg-neon-soft" style="width: 42px; height: 42px;">
                <i class="bi bi-lightning-charge-fill fs-5"></i>
            </div>
            <span class="fw-bolder fs-3 text-white">GYM<span class="text-neon">LINK</span></span>
        </a>
    </div>

    <div class="bento-card p-4 p-md-5 shadow-lg">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h3 class="fw-bold text-white mb-1">Únete al Club</h3>
                <p class="text-secondary small mb-0">Activa tu pasaporte de puntos, XP y recompensas VIP</p>
            </div>
            <span class="badge bg-neon-soft rounded-pill px-3 py-2">+100 PTS Bienvenida</span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger bg-fire-soft border border-danger border-opacity-25 text-white rounded-3 small">
            <i class="bi bi-exclamation-circle-fill me-2 text-fire"></i><span th:text="${errorMessage}">Error al registrar</span>
        </div>

        <form th:action="@{/register}" method="post" class="d-flex flex-column gap-3 mt-3">
            <div>
                <label for="regFullName" class="form-label small text-secondary fw-semibold">Nombre Completo</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" id="regFullName" name="fullName" required
                           class="form-control bg-dark border-secondary border-opacity-25 text-white py-2"
                           placeholder="Ej. Sofía Restrepo">
                </div>
            </div>

            <div>
                <label for="regDocument" class="form-label small text-secondary fw-semibold">Documento / Cédula</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="bi bi-card-heading"></i></span>
                    <input type="text" id="regDocument" name="documentNumber" required
                           class="form-control bg-dark border-secondary border-opacity-25 text-white py-2 font-mono-tabular"
                           placeholder="Ej. 1020304050">
                </div>
                <small class="text-secondary" style="font-size: 0.72rem;">Usarás este número para tu check-in ultrarrápido en recepción.</small>
            </div>

            <div>
                <label for="regEmail" class="form-label small text-secondary fw-semibold">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="regEmail" name="email" required
                           class="form-control bg-dark border-secondary border-opacity-25 text-white py-2"
                           placeholder="sofia@correo.com">
                </div>
            </div>

            <div>
                <label for="regPassword" class="form-label small text-secondary fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" id="regPassword" name="password" minlength="6" required
                           class="form-control bg-dark border-secondary border-opacity-25 text-white py-2"
                           placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <button type="submit" class="btn btn-neon py-2 rounded-3 mt-2 fs-6">
                Crear Perfil Atlético <i class="bi bi-lightning-charge-fill ms-1"></i>
            </button>
        </form>

        <p class="text-center text-secondary small mt-4 mb-0">
            ¿Ya tienes cuenta activa?
            <a th:href="@{/login}" class="text-neon text-decoration-none fw-bold">Inicia sesión</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/gymlink.js}"></script>
</body>
</html>
